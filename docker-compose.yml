services:
  frontend:                     # questo nome "frontend" diventa un indirizzo di rete per usare il fe all'interno del network privato di docker
    image: nginx:alpine
    container_name: quotes_frontend
    restart: always
    ports:
      - '8080:80'
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
  db:                    #questo nome "db" diventa un indirizzo di rete per usare il db, infatti il backend to raggiunge scrivendo DB_HOST:db
    image: postgres:18
    container_name: quotes_db
    restart: always    #se il container si ferma o crasha, Docker lo riavvia automaticamente
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5432:5432'
    volumes:
      - quotes_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]      
      interval: 5s
      timeout: 5s
      retries: 5

  backend:        # questo nome "backend" diventa un indirizzo di rete per usare il be 
    build: ./backend
    container_name: quotes_backend
    restart: always
    env_file:
      - .env
    environment:
      DB_HOST: db
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
    

volumes:
  quotes_data: