<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quotes Archive</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:    #1a1209;
      --paper:  #f5f0e8;
      --cream:  #ede8dc;
      --gold:   #b8860b;
      --rust:   #8b3a1a;
      --muted:  #7a6f5e;
      --border: #c8bfaa;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    header {
      background: var(--ink);
      color: var(--paper);
      padding: 1.2rem 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 20px rgba(0,0,0,.35);
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      letter-spacing: .04em;
    }

    header h1 span { color: var(--gold); font-style: italic; }

    .header-right { display: flex; align-items: center; gap: 1.2rem; }

    #username-display {
      font-size: .85rem;
      color: var(--border);
      font-weight: 300;
    }

    #username-display strong { color: var(--paper); font-weight: 500; }

    .btn {
      padding: .5rem 1.2rem;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: .85rem;
      font-weight: 500;
      letter-spacing: .05em;
      text-transform: uppercase;
      transition: all .2s;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--border);
    }
    .btn-ghost:hover { background: var(--border); color: var(--ink); }

    .btn-gold { background: var(--gold); color: #fff; }
    .btn-gold:hover { background: #a07808; }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    #empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 55vh;
      text-align: center;
      gap: 1.2rem;
    }

    #empty-state .big-quote {
      font-family: 'Playfair Display', serif;
      font-size: 8rem;
      line-height: 1;
      color: var(--border);
      user-select: none;
    }

    #empty-state p {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 340px;
      line-height: 1.6;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: .8rem;
    }

    .section-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 400;
    }

    .section-header h2 em { color: var(--gold); }

    #quotes-grid { display: grid; gap: 1.5rem; }

    .quote-card {
      background: #fff;
      border: 1px solid var(--border);
      border-left: 4px solid var(--gold);
      padding: 1.6rem 1.8rem;
      animation: fadeUp .35s ease both;
      position: relative;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .quote-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      line-height: 1.7;
      margin-bottom: 1rem;
      font-style: italic;
    }

    .quote-text::before { content: '\201C'; color: var(--gold); font-size: 1.4em; }
    .quote-text::after  { content: '\201D'; color: var(--gold); font-size: 1.4em; }

    .quote-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .6rem;
      font-size: .82rem;
      color: var(--muted);
    }

    .quote-author {
      font-weight: 600;
      color: var(--ink);
      font-size: .9rem;
    }

    .tag {
      background: var(--cream);
      border: 1px solid var(--border);
      padding: .15rem .55rem;
      border-radius: 2px;
      font-size: .75rem;
      color: var(--muted);
    }

    .quote-actions {
      position: absolute;
      top: 1rem;
      right: 1rem;
      display: flex;
      gap: .4rem;
      opacity: 0;
      transition: opacity .2s;
    }

    .quote-card:hover .quote-actions { opacity: 1; }

    .action-btn {
      background: none;
      border: 1px solid var(--border);
      padding: .2rem .5rem;
      cursor: pointer;
      font-size: .75rem;
      color: var(--muted);
      border-radius: 2px;
      transition: all .15s;
    }

    .action-btn:hover { background: var(--rust); border-color: var(--rust); color: #fff; }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(26,18,9,.6);
      z-index: 200;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(2px);
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--paper);
      border: 1px solid var(--border);
      padding: 2.2rem 2.5rem;
      width: min(520px, 94vw);
      animation: popIn .25s ease;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(.95); }
      to   { opacity: 1; transform: scale(1); }
    }

    .modal h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      margin-bottom: 1.5rem;
    }

    .field { margin-bottom: 1.1rem; }

    .field label {
      display: block;
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: .35rem;
      font-weight: 500;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: .65rem .85rem;
      border: 1px solid var(--border);
      background: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      color: var(--ink);
      outline: none;
      transition: border-color .2s;
      border-radius: 2px;
    }

    .field input:focus,
    .field textarea:focus { border-color: var(--gold); }

    .field textarea { resize: vertical; min-height: 90px; }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: .8rem;
      margin-top: 1.6rem;
    }

    #toast {
      position: fixed;
      bottom: 1.8rem;
      right: 1.8rem;
      background: var(--ink);
      color: var(--paper);
      padding: .75rem 1.3rem;
      font-size: .85rem;
      border-left: 3px solid var(--gold);
      opacity: 0;
      transform: translateY(8px);
      transition: all .3s;
      pointer-events: none;
      z-index: 500;
    }

    #toast.show { opacity: 1; transform: translateY(0); }

    #spinner {
      display: none;
      justify-content: center;
      padding: 4rem 0;
    }

    .spinner-ring {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <h1>Quotes <span>Archive</span></h1>
    <div class="header-right">
      <span id="username-display">Ciao, <strong id="uname">—</strong></span>
      <button class="btn btn-gold" onclick="openModal()">+ Add Quote</button>
      <button class="btn btn-ghost" onclick="logout()">Logout</button>
    </div>
  </header>

  <main>
    <div id="spinner"><div class="spinner-ring"></div></div>

    <div id="empty-state">
      <div class="big-quote">"</div>
      <p>No quotes yet. Be the first to add one to the archive.</p>
      <button class="btn btn-gold" onclick="openModal()">Add the first quote</button>
    </div>

    <div id="quotes-section" style="display:none">
      <div class="section-header">
        <h2>All <em>Quotes</em></h2>
        <button class="btn btn-gold" onclick="openModal()">+ Add Quote</button>
      </div>
      <div id="quotes-grid"></div>
    </div>
  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3>Add a Quote</h3>
      <div class="field">
        <label>Quote *</label>
        <textarea id="f-text" placeholder="The quote itself…"></textarea>
      </div>
      <div class="field">
        <label>Author *</label>
        <input id="f-author" type="text" placeholder="Who said it" />
      </div>
      <div class="field">
        <label>Category</label>
        <input id="f-category" type="text" placeholder="e.g. Philosophy, Science…" />
      </div>
      <div class="field">
        <label>Source</label>
        <input id="f-source" type="text" placeholder="Book, speech, website…" />
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-gold" onclick="submitQuote()">Save Quote</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const API = 'http://localhost:8000';
    let token = localStorage.getItem('token');
    let currentUserId = null;

    if (!token) window.location.href = 'index.html';

    async function init() {
      try {
        const me = await apiFetch('/api/users/me');
        document.getElementById('uname').textContent = me.username;
        currentUserId = me.id;
        await loadQuotes();
      } catch { logout(); }
    }

    async function loadQuotes() {
      showSpinner(true);
      try {
        const quotes = await apiFetch('/api/quotes/all');
        renderQuotes(quotes);
      } catch { toast('Error loading quotes', true); }
      finally { showSpinner(false); }
    }

    function renderQuotes(quotes) {
      const grid = document.getElementById('quotes-grid');
      const empty = document.getElementById('empty-state');
      const section = document.getElementById('quotes-section');
      grid.innerHTML = '';

      if (!quotes.length) {
        empty.style.display = 'flex';
        section.style.display = 'none';
        return;
      }

      empty.style.display = 'none';
      section.style.display = 'block';

      quotes.forEach((q, i) => {
        const isMine = q.user_id === currentUserId;
        const card = document.createElement('div');
        card.className = 'quote-card';
        card.style.animationDelay = `${i * 0.05}s`;
        const date = new Date(q.date_added).toLocaleDateString('it-IT', {
          day: '2-digit', month: 'short', year: 'numeric'
        });
        card.innerHTML = `
          ${isMine ? `<div class="quote-actions">
            <button class="action-btn" onclick="deleteQuote(${q.id})">Delete</button>
          </div>` : ''}
          <div class="quote-text">${escHtml(q.text)}</div>
          <div class="quote-meta">
            <span class="quote-author">— ${escHtml(q.author)}</span>
            ${q.category ? `<span class="tag">${escHtml(q.category)}</span>` : ''}
            ${q.source ? `<span class="tag">📖 ${escHtml(q.source)}</span>` : ''}
            <span style="margin-left:auto">${date}</span>
          </div>`;
        grid.appendChild(card);
      });
    }

    function openModal() {
      document.getElementById('modal').classList.add('open');
      document.getElementById('f-text').focus();
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
      ['f-text','f-author','f-category','f-source'].forEach(id =>
        document.getElementById(id).value = '');
    }

    async function submitQuote() {
      const text = document.getElementById('f-text').value.trim();
      const author = document.getElementById('f-author').value.trim();
      if (!text || !author) { toast('Quote and Author are required'); return; }
      try {
        await apiFetch('/api/quotes/', {
          method: 'POST',
          body: JSON.stringify({
            text, author,
            category: document.getElementById('f-category').value.trim() || null,
            source:   document.getElementById('f-source').value.trim() || null
          })
        });
        closeModal();
        toast('Quote saved! ✓');
        await loadQuotes();
      } catch { toast('Error saving quote', true); }
    }

    async function deleteQuote(id) {
      if (!confirm('Delete this quote?')) return;
      try {
        await apiFetch(`/api/quotes/${id}`, { method: 'DELETE' });
        toast('Quote deleted');
        await loadQuotes();
      } catch { toast('Error deleting', true); }
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = 'index.html';
    }

    async function apiFetch(path, opts = {}) {
      const res = await fetch(API + path, {
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        ...opts
      });
      if (!res.ok) throw new Error(res.status);
      return res.json();
    }

    function showSpinner(v) {
      document.getElementById('spinner').style.display = v ? 'flex' : 'none';
    }

    let toastTimer;
    function toast(msg, err = false) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.borderLeftColor = err ? '#c0392b' : 'var(--gold)';
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    document.getElementById('modal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    init();
  </script>
</body>
</html>
